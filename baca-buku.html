                    <div class="w-full h-full flex flex-col justify-between">
                        <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 mb-3">
                            <h4 class="font-extrabold text-xs text-indigo-950 mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                                Pertanyaan 1:
                            </h4>
                            <p class="text-xs text-slate-700 mb-2 font-medium">
                                Permainan melompat satu kaki di kotak kapur berbentuk sayap pesawat adalah...
                            </p>
                            <div class="grid grid-cols-1 gap-1.5">
                                <button onclick="answerQuiz(1, 0, 1, this)" class="text-left px-3 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-indigo-50 transition-colors text-slate-700">
                                    A. Gasing Kayu
                                </button>
                                <button onclick="answerQuiz(1, 1, 1, this)" class="text-left px-3 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-indigo-50 transition-colors text-slate-700">
                                    B. Engklek / Sundamanda
                                </button>
                                <button onclick="answerQuiz(1, 2, 1, this)" class="text-left px-3 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-indigo-50 transition-colors text-slate-700">
                                    C. Congklak Dakon
                                </button>
                            </div>
                        </div>

                        <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200">
                            <h4 class="font-extrabold text-xs text-indigo-950 mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                                Pertanyaan 2:
                            </h4>
                            <p class="text-xs text-slate-700 mb-2 font-medium">
                                Benda kayu yang diputar kencang dengan tarikan tali hingga berdengung merdu adalah...
                            </p>
                            <div class="grid grid-cols-1 gap-1.5">
                                <button onclick="answerQuiz(2, 0, 0, this)" class="text-left px-3 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-indigo-50 transition-colors text-slate-700">
                                    A. Gasing Kayu Jati
                                </button>
                                <button onclick="answerQuiz(2, 1, 0, this)" class="text-left px-3 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-indigo-50 transition-colors text-slate-700">
                                    B. Egrang Bambu
                                </button>
                                <button onclick="answerQuiz(2, 2, 0, this)" class="text-left px-3 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-indigo-50 transition-colors text-slate-700">
                                    C. Layang-layang
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return '';
        }

        window.answerQuiz = function(qNum, selectedIndex, correctIndex, btn) {
            playPageFlipSound();
            const parent = btn.parentElement;
            parent.querySelectorAll('button').forEach(b => {
                b.disabled = true;
                b.className = 'text-left px-3 py-2 rounded-xl text-xs font-bold border border-slate-200 opacity-60 text-slate-500 bg-white';
            });

            if (selectedIndex === correctIndex) {
                btn.className = 'text-left px-3 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-white shadow-md border border-emerald-600';
                btn.innerHTML += ' &bull; Hebat, Jawabanmu Benar!';
            } else {
                btn.className = 'text-left px-3 py-2 rounded-xl text-xs font-bold bg-rose-500 text-white shadow-md border border-rose-600';
                btn.innerHTML += ' &bull; Masih Belum Tepat';
                parent.children[correctIndex].className = 'text-left px-3 py-2 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-900 border border-emerald-400 font-extrabold';
            }
        };

        function renderCurrentSpread() {
            const root = document.getElementById('flipbook-root');
            const spread = SPREADS[currentSpreadIndex];

            const badge = document.getElementById('page-status-badge');
            if (currentSpreadIndex === 0) {
                badge.innerText = 'Sampul Depan';
            } else if (spread.right === 15) {
                badge.innerText = 'Kuis & Sampul Penutup';
            } else {
                badge.innerText = `Halaman ${spread.left} - ${spread.right} dari 15`;
            }

            const prevDisabled = currentSpreadIndex === 0;
            const nextDisabled = currentSpreadIndex === SPREADS.length - 1;

            document.getElementById('btn-floating-prev').disabled = prevDisabled;
            document.getElementById('btn-floating-next').disabled = nextDisabled;
            document.getElementById('btn-bar-prev').disabled = prevDisabled;
            document.getElementById('btn-bar-next').disabled = nextDisabled;

            if (currentSpreadIndex === 0) {
                const p1 = BOOK_PAGES[0];
                root.innerHTML = `
                    <div class="relative w-[300px] sm:w-[360px] lg:w-[390px] aspect-[3/4] rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl border-2 border-amber-400/60 bg-gradient-to-br from-indigo-950 via-slate-900 to-indigo-900 flex flex-col justify-between p-5 sm:p-6 transition-all duration-300">
                        <div class="absolute inset-0 z-0 opacity-45 mix-blend-luminosity overflow-hidden">
                            <img src="${p1.coverImg}" alt="${p1.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent z-1"></div>
                        <div class="absolute inset-y-0 left-0 w-3 bg-gradient-to-r from-black/50 to-transparent z-10 pointer-events-none"></div>

                        <div class="relative z-10 flex items-center justify-between">
                            <span class="inline-flex items-center gap-1.5 text-[10px] sm:text-xs font-extrabold px-3 py-1 rounded-full bg-amber-400 text-slate-950 shadow-md">
                                ${p1.badge}
                            </span>
                            <span class="text-xs font-bold text-amber-300">15 Halaman</span>
                        </div>

                        <div class="relative z-10 my-auto text-center py-4">
                            <div class="w-28 h-28 sm:w-36 sm:h-36 mx-auto rounded-3xl overflow-hidden border-3 border-amber-400 shadow-2xl mb-4 group">
                                <img src="${p1.coverImg}" alt="${p1.title}" class="w-full h-full object-cover">
                            </div>
                            <h2 class="font-display font-extrabold text-white text-xl sm:text-2xl lg:text-3xl leading-snug drop-shadow-md mb-2">
                                CERIA DI KAMPUNG KAMI
                            </h2>
                            <p class="text-amber-300 font-bold text-xs sm:text-sm tracking-wide">
                                5 Permainan Tradisional Indonesia
                            </p>
                        </div>

                        <div class="relative z-10 pt-3 border-t border-white/20 flex items-center justify-between">
                            <div class="text-[11px] text-indigo-200">
                                <span>Karya Edukasi Cilik</span>
                                <strong class="block text-white font-bold">Kak Rian &amp; Sahabat</strong>
                            </div>
                            <button onclick="flipNext()" class="px-4 py-2 rounded-xl text-xs font-extrabold text-slate-950 bg-amber-400 hover:bg-amber-300 shadow-lg transition-transform active:scale-95 flex items-center gap-1.5 cursor-pointer">
                                <span>Buka Buku Cerita</span>
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const leftData = BOOK_PAGES.find(p => p.pageNumber === spread.left);
            const rightData = BOOK_PAGES.find(p => p.pageNumber === spread.right);

            root.innerHTML = `
                <div class="flex flex-row items-stretch w-[94vw] max-w-4xl lg:max-w-5xl h-[68vh] sm:h-[72vh] max-h-[630px] rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl border border-white/10 transition-all duration-300">
                    
                    <div class="book-page-white w-1/2 h-full relative flex flex-col justify-between p-4 sm:p-7 border-r border-slate-200">
                        <div class="absolute inset-y-0 right-0 w-8 spine-shadow-left pointer-events-none z-10"></div>

                        <div class="flex items-center justify-between pb-2 border-b border-slate-200 mb-2.5">
                            <span class="text-[10px] sm:text-xs font-extrabold uppercase tracking-wider text-indigo-700">
                                ${leftData.topic}
                            </span>
                            <span class="text-[10px] sm:text-xs font-bold text-slate-400">
                                Hal ${leftData.pageNumber}
                            </span>
                        </div>

                        <div class="flex-1 overflow-y-auto custom-scroll pr-1 flex flex-col justify-between">
                            <h3 class="font-display font-extrabold text-slate-900 text-sm sm:text-base lg:text-lg mb-2">
                                ${leftData.title}
                            </h3>
                            <div class="flex-1">
                                ${getVectorIllustration(leftData.vectorType)}
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400 font-medium">
                            <span>Buku Cerita Anak Nusantara</span>
                            <span class="font-bold text-slate-500">${leftData.pageNumber}</span>
                        </div>
                    </div>

                    <div class="book-page-white w-1/2 h-full relative flex flex-col justify-between p-4 sm:p-7">
                        <div class="absolute inset-y-0 left-0 w-8 spine-shadow-right pointer-events-none z-10"></div>

                        <div class="flex items-center justify-between pb-2 border-b border-slate-200 mb-2.5">
                            <span class="text-[10px] sm:text-xs font-bold text-slate-400">
                                Hal ${rightData.pageNumber}
                            </span>
                            <span class="text-[10px] sm:text-xs font-extrabold uppercase tracking-wider text-indigo-700">
                                ${rightData.topic}
                            </span>
                        </div>

                        <div class="flex-1 overflow-y-auto custom-scroll pr-1">
                            ${renderRightPageContent(rightData)}
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400 font-medium">
                            <span class="font-bold text-slate-500">${rightData.pageNumber}</span>
                            <span>CintaBaca Edukasi</span>
                        </div>
                    </div>

                </div>
            `;
        }

        function renderRightPageContent(data) {
            if (data.type === 'backcover') {
                return `
                    <div class="h-full flex flex-col justify-between text-center py-2">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 mx-auto rounded-3xl bg-amber-100 border border-amber-300 flex items-center justify-center text-3xl mb-2 shadow-xs">
                            🏆
                        </div>
                        <h4 class="font-extrabold text-sm sm:text-base text-slate-900 mb-1">
                            Kamu Sahabat Cilik Pelestari Budaya!
                        </h4>
                        <p class="text-slate-600 text-[11px] sm:text-xs leading-relaxed mb-3">
                            Selamat! Kamu telah menamatkan petualangan 5 permainan tradisional Indonesia. Sekarang, mari ajak teman dan keluarga bermain bersama di halaman rumah!
                        </p>
                        <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-slate-800 text-xs mb-3 text-left space-y-1">
                            <div class="font-bold text-indigo-900">Rangkuman Warisan Nusantara:</div>
                            <div class="text-[11px] text-slate-600">• Engklek (Keseimbangan) &bull; Egrang (Keberanian)</div>
                            <div class="text-[11px] text-slate-600">• Gasing (Ketelitian) &bull; Congklak (Kejujuran)</div>
                            <div class="text-[11px] text-slate-600">• Layang-layang &amp; Gobak Sodor (Kekompakan)</div>
                        </div>
                        <div class="flex justify-center gap-2">
                            <button onclick="goToPage(1)" class="px-4 py-2 rounded-xl text-xs font-extrabold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition-transform active:scale-95 cursor-pointer">
                                🔄 Baca Ulang
                            </button>
                            <a href="./detail-buku.html" class="px-4 py-2 rounded-xl text-xs font-extrabold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 transition-colors">
                                🏠 Selesai
                            </a>
                        </div>
                    </div>
                `;
            }

            return `
                <div>
                    <h3 class="font-display font-extrabold text-slate-900 text-sm sm:text-base lg:text-lg mb-2">
                        ${data.title}
                    </h3>
                    ${data.storyHtml}
                </div>
            `;
        }

        function flipNext() {
            if (currentSpreadIndex < SPREADS.length - 1) {
                currentSpreadIndex++;
                playPageFlipSound();
                renderCurrentSpread();
            }
        }

        function flipPrev() {
            if (currentSpreadIndex > 0) {
                currentSpreadIndex--;
                playPageFlipSound();
                renderCurrentSpread();
            }
        }

        function goToPage(pageNumber) {
            for (let i = 0; i < SPREADS.length; i++) {
                if (SPREADS[i].right === pageNumber || SPREADS[i].left === pageNumber) {
                    currentSpreadIndex = i;
                    playPageFlipSound();
                    renderCurrentSpread();
                    closeTocModal();
                    return;
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                flipNext();
            } else if (e.key === 'ArrowLeft') {
                flipPrev();
            } else if (e.key.toLowerCase() === 'f') {
                toggleFullscreen();
            }
        });

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            document.getElementById('icon-sound').innerText = isSoundEnabled ? '🔊' : '🔇';
            document.getElementById('text-sound').innerText = isSoundEnabled ? 'Suara' : 'Bisu';
            if (isSoundEnabled) playPageFlipSound();
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('btn-autoplay');
            if (isAutoPlaying) {
                document.getElementById('icon-autoplay').innerText = '⏸';
                document.getElementById('text-autoplay').innerText = 'Jeda';
                btn.classList.add('bg-indigo-600/80', 'text-amber-300');
                autoPlayTimer = setInterval(() => {
                    if (currentSpreadIndex >= SPREADS.length - 1) {
                        toggleAutoPlay();
                    } else {
                        flipNext();
                    }
                }, 7000);
            } else {
                document.getElementById('icon-autoplay').innerText = '▶';
                document.getElementById('text-autoplay').innerText = 'Otomatis';
                btn.classList.remove('bg-indigo-600/80', 'text-amber-300');
                if (autoPlayTimer) clearInterval(autoPlayTimer);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function openTocModal() {
            const list = document.getElementById('toc-list');
            const chapters = [
                { page: 1, title: 'Sampul Depan: Ceria di Kampung Kami', desc: 'Cover Buku Bergambar' },
                { page: 2, title: 'Pembuka: Pagi Ceria di Sukamaju & 4 Sahabat', desc: 'Halaman 2 - 3 (Cerita 1)' },
                { page: 4, title: 'Permainan 1: Lompat Kotak Engklek Ceria', desc: 'Halaman 4 - 5 (Cerita 2)' },
                { page: 6, title: 'Permainan 2: Menjulang Tinggi Egrang Bambu', desc: 'Halaman 6 - 7 (Cerita 3)' },
                { page: 8, title: 'Permainan 3: Gasing Kayu Berputar Merdu', desc: 'Halaman 8 - 9 (Cerita 4)' },
                { page: 10, title: 'Permainan 4: Congklak Biji Kerang di Beranda', desc: 'Halaman 10 - 11 (Cerita 5)' },
                { page: 12, title: 'Permainan 5: Layang-Layang Sore & Gobak Sodor', desc: 'Halaman 12 - 13 (Cerita 6)' },
                { page: 14, title: 'Kuis Asah Cerdas & Sampul Penutup', desc: 'Halaman 14 - 15 (Penutup)' }
            ];

            list.innerHTML = chapters.map(c => `
                <div onclick="goToPage(${c.page})" class="flex items-center justify-between p-3 rounded-2xl bg-white/5 hover:bg-indigo-600/30 border border-white/10 transition-colors cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center">
                            ${c.page}
                        </span>
                        <div>
                            <div class="text-xs font-extrabold text-white">
                                ${c.title}
                            </div>
                            <div class="text-[10px] text-indigo-300">
                                ${c.desc}
                            </div>
                        </div>
                    </div>
                    <span class="text-xs text-amber-300 font-bold">Buka &rarr;</span>
                </div>
            `).join('');
            document.getElementById('toc-modal').classList.remove('hidden');
            document.getElementById('toc-modal').classList.add('flex');
        }

        function closeTocModal() {
            document.getElementById('toc-modal').classList.add('hidden');
            document.getElementById('toc-modal').classList.remove('flex');
        }

        function initStars() {
            const container = document.getElementById('stars-field');
            const numStars = 60;
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${(Math.random() * 4 + 2).toFixed(1)}s`);
                container.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initStars();
            renderCurrentSpread();
        });
    </script>
</body>
</html>
